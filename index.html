<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>liquid-tabbar on web · The iOS Liquid Glass tab bar, for the web</title>
<meta name="description" content="The iOS Liquid Glass tab bar, recreated on the web. Vanilla JS + CSS, zero dependencies.">
<link rel="stylesheet" href="liquid-tabbar.css?v=2.7.5">
<style>
 /* ---------- Tokens (page follows the system; the header button overrides) ---------- */
 :root{
  --bg:#f5f5f7;--bg2:#ffffff;--ink:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--card:#ffffff;
  --code:#f0f0f3;--accent:#0a84ff;--glass:rgba(255,255,255,.62);--glass-line:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);
  color-scheme:light;
 }
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--bg2:#0d0d0f;--ink:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.1);--card:#141416;
  --code:#1c1c1f;--accent:#409cff;--glass:rgba(22,22,24,.6);--glass-line:rgba(255,255,255,.08);
  --shadow:0 0 0 1px rgba(255,255,255,.06);color-scheme:dark}}
 :root[data-theme="dark"]{
  --bg:#000;--bg2:#0d0d0f;--ink:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.1);--card:#141416;
  --code:#1c1c1f;--accent:#409cff;--glass:rgba(22,22,24,.6);--glass-line:rgba(255,255,255,.08);
  --shadow:0 0 0 1px rgba(255,255,255,.06);color-scheme:dark}

 *{box-sizing:border-box}
 html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
 @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
 body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
 a{color:var(--accent);text-decoration:none}
 a:hover{text-decoration:underline}
 code,pre,kbd{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
 .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
 section{scroll-margin-top:64px}

 /* ---------- Header ---------- */
 .top{position:sticky;top:0;z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
 .top .wrap{display:flex;align-items:center;gap:20px;height:52px}
 .logo{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--ink);letter-spacing:-.01em}
 .logo:hover{text-decoration:none}
 .logo i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,#ff5f6d,#ffc371,#47e1b3,#3d8bff,#a66bff,#ff5f6d);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
 .top nav{display:flex;gap:18px;margin-left:auto;font-size:14px}
 .top nav a{color:var(--sub)}
 .top nav a:hover{color:var(--ink);text-decoration:none}
 .tools{display:flex;align-items:center;gap:8px}
 .chip{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;height:30px;padding:0 12px;cursor:pointer}
 .chip:hover{background:var(--line)}
 .icon-btn{width:30px;padding:0;display:grid;place-items:center}
 .icon-btn svg{width:16px;height:16px}
 @media (max-width:760px){.top nav{display:none}.tools{margin-left:auto}}

 /* ---------- Wallpapers (color behind the glass) ---------- */
 .wall-a{background:radial-gradient(55% 45% at 15% 15%,#ff6a4d 0,transparent 70%),radial-gradient(50% 50% at 90% 20%,#7b5cff 0,transparent 70%),radial-gradient(60% 55% at 70% 95%,#00c9a7 0,transparent 70%),radial-gradient(40% 40% at 20% 85%,#ffb800 0,transparent 70%),#1a1c3a}
 .wall-c{background:radial-gradient(55% 45% at 85% 15%,#00b4ff 0,transparent 70%),radial-gradient(50% 55% at 10% 40%,#00d68f 0,transparent 70%),radial-gradient(55% 50% at 70% 95%,#3d5afe 0,transparent 70%),#0d2233}
 .wall-d{background:radial-gradient(55% 45% at 20% 10%,#ff4f9a 0,transparent 70%),radial-gradient(50% 55% at 90% 50%,#ff9a3d 0,transparent 70%),radial-gradient(55% 50% at 20% 95%,#8a3dff 0,transparent 70%),#2a1030}
 .wall-b{background:radial-gradient(60% 50% at 80% 10%,#ffd6e8 0,transparent 70%),radial-gradient(60% 60% at 10% 60%,#c9e7ff 0,transparent 70%),radial-gradient(50% 50% at 90% 90%,#fff1c2 0,transparent 70%),#f2eefc}

 /* ---------- Hero ---------- */
 .hero{position:relative;color:#fff;overflow:hidden}
 .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,0) 40%,rgba(0,0,0,.25));pointer-events:none}
 .hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-top:72px;padding-bottom:72px}
 .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
 .hero h1{font-size:clamp(40px,6.4vw,76px);line-height:1.02;letter-spacing:-.035em;font-weight:750;margin:20px 0 18px;text-shadow:0 2px 24px rgba(0,0,0,.18)}
 .lede{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:rgba(255,255,255,.88);max-width:34em;margin:0 0 30px}
 .ctas{display:flex;gap:12px;flex-wrap:wrap}
 .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;border:0}
 .btn:hover{text-decoration:none}
 .btn-primary{background:#fff;color:#111}
 .btn-primary:hover{background:#f0f0f0}
 .btn-glass{color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
 .btn-glass:hover{background:rgba(255,255,255,.22)}
 .hero-side{display:grid;justify-items:center;gap:14px}
 .hint{font-size:13px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px}
 .hint svg{width:16px;height:16px}
 @media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:40px;padding-top:48px;padding-bottom:56px}}

 /* ---------- Phone + stages: the bar lives inside, not on the viewport ---------- */
 .phone{position:relative;width:300px;max-width:100%;height:620px;border-radius:48px;padding:10px;background:#0b0b0c;box-shadow:0 0 0 1.5px #3a3a3c,0 30px 80px rgba(0,0,0,.45)}
 /* Rounded clipping uses clip-path, not overflow:hidden + border-radius: Chrome lets the bar's backdrop blur
    bleed out as a hard-edged rectangle inside a rounded overflow clip */
 .phone .scr{position:relative;height:100%;border-radius:38px;clip-path:inset(0 round 38px);isolation:isolate}
 .phone .scr::before{content:"";position:absolute;top:10px;left:50%;width:90px;height:26px;margin-left:-45px;border-radius:20px;background:#000;z-index:40}
 .stage{position:relative;height:360px;border-radius:22px;clip-path:inset(0 round 22px);isolation:isolate}
 .scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
 .scroller::-webkit-scrollbar{display:none}
 .phone .ltb,.stage .ltb{position:absolute;--ltb-bottom:14px;--ltb-z:30}

 /* Mock app content inside a screen */
 .app{padding:52px 16px 110px;color:#fff;min-height:100%}
 .stage .app{padding-top:52px}
 .app.light{color:#1d1d1f}
 .app h4{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0 0 4px;font-weight:750}
 .app .when{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin:0 0 14px}
 .hero-card{height:150px;border-radius:20px;margin-bottom:12px;position:relative;overflow:hidden}
 .hero-card::after{content:"";position:absolute;left:14px;right:40%;bottom:14px;height:10px;border-radius:5px;background:rgba(255,255,255,.75)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .tile{border-radius:16px;aspect-ratio:4/5;position:relative;overflow:hidden;cursor:default;border:0;padding:0;font:inherit;color:inherit;display:block;width:100%}
 button.tile{cursor:pointer}
 .tile::after{content:"";position:absolute;left:10px;right:30%;bottom:10px;height:7px;border-radius:4px;background:rgba(255,255,255,.7)}
 .detail .art{height:220px;border-radius:22px;margin:4px 0 16px}
 .bars{display:grid;gap:8px}
 .bars i{display:block;height:9px;border-radius:5px;background:currentColor;opacity:.16}
 .bars i:nth-child(3n){width:70%}.bars i:nth-child(4n){width:85%}

 /* ---------- Sections ---------- */
 .sec{padding:96px 0}
 .sec.alt{background:var(--bg2)}
 .kicker{font-size:14px;font-weight:600;color:var(--accent);margin:0 0 10px}
 .sec h2{font-size:clamp(32px,4.4vw,52px);line-height:1.06;letter-spacing:-.03em;font-weight:750;margin:0 0 14px}
 .sec .sub{font-size:clamp(17px,1.5vw,19px);color:var(--sub);max-width:40em;margin:0 0 48px}

 /* Showcase cards */
 .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
 .card{background:var(--card);border-radius:28px;padding:12px 12px 22px;box-shadow:var(--shadow)}
 .card .meta{padding:18px 10px 0}
 .card h3{font-size:21px;letter-spacing:-.01em;margin:0 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
 .card h3 code{font-size:13px;font-weight:500;color:var(--sub);background:var(--code);padding:2px 8px;border-radius:7px}
 .card p{margin:0 0 10px;color:var(--sub);font-size:15px}
 .card .more{font-size:15px;font-weight:500}
 .swatches{position:absolute;top:14px;right:14px;z-index:35;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 4px 14px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
 .swatches button{width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
 .swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
 .badge{position:absolute;top:14px;left:14px;z-index:35;font-size:12px;font-weight:600;color:#fff;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
 @media (max-width:760px){.cards{grid-template-columns:1fr}}

 /* Playground */
 .play{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:start}
 .play .phone{position:sticky;top:76px}
 .panel{background:var(--card);border-radius:24px;padding:8px 20px;box-shadow:var(--shadow)}
 .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
 .row:last-child{border-bottom:0}
 .row b{font-weight:600;font-size:15px}
 .seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--code);flex-wrap:wrap}
 .seg button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink);border-radius:8px;min-width:52px;height:30px;padding:0 12px;cursor:pointer}
 .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
 :root[data-theme="dark"] .seg button.on{background:#3a3a3c}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#3a3a3c}}
 .colors{display:flex;align-items:center;gap:8px}
 .colors input{width:34px;height:30px;border:0;background:none;padding:0;cursor:pointer}
 #log{font:13px/1.5 ui-monospace,"SF Mono",Menlo,monospace;color:var(--sub);min-height:3em;white-space:pre-wrap;margin:18px 4px 0}
 .codebox{position:relative;margin-top:20px;background:var(--code);border-radius:18px}
 .codebox pre{margin:0;padding:18px 20px;overflow-x:auto;font-size:13px;line-height:1.6;color:var(--ink)}
 .codebox .c{color:var(--sub)}
 .copy{position:absolute;top:10px;right:10px;background:var(--card)}
 .play>div:last-child{min-width:0}
 @media (max-width:860px){.play{grid-template-columns:minmax(0,1fr);justify-items:center}.play .phone{position:relative;top:0}.play>div:last-child{width:100%}}

 /* Features */
 .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
 .feat{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
 .sec.alt .feat{background:var(--bg)}
 .feat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:16px;color:#fff}
 .feat .ic svg{width:22px;height:22px}
 .feat h3{font-size:18px;margin:0 0 6px;letter-spacing:-.01em}
 .feat p{margin:0;color:var(--sub);font-size:15px}
 @media (max-width:900px){.feats{grid-template-columns:repeat(2,1fr)}}
 @media (max-width:560px){.feats{grid-template-columns:1fr}}

 /* Support */
 .support{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
 .eng{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
 .eng b{display:block;font-size:17px}
 .eng span{color:var(--sub);font-size:15px}
 .eng .v{font-size:34px;font-weight:750;letter-spacing:-.03em;color:var(--ink);display:block;margin-top:6px}
 table{width:100%;border-collapse:collapse;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);font-size:15px}
 th,td{text-align:left;padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:top}
 th{font-size:13px;color:var(--sub);font-weight:600}
 tr:last-child td{border-bottom:0}
 td:first-child{font-weight:600;white-space:nowrap}
 td:last-child{color:var(--sub)}
 .tablewrap{overflow-x:auto;border-radius:22px}
 @media (max-width:700px){.support{grid-template-columns:1fr}}

 /* Get started */
 .steps{display:grid;gap:16px;counter-reset:s}
 .step{display:grid;grid-template-columns:48px 1fr;gap:18px;background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
 .sec.alt .step{background:var(--bg)}
 .step .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ink);color:var(--bg)}
 .step h3{margin:6px 0 6px;font-size:19px}
 .step p{margin:0 0 4px;color:var(--sub)}
 .step .codebox{margin-top:14px}
 .step>div{min-width:0}
 .callout{margin-top:24px;padding:22px 24px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#fff}
 .callout b{font-size:18px}
 .callout p{margin:4px 0 0;color:rgba(255,255,255,.85)}
 @media (max-width:560px){.step{grid-template-columns:1fr;gap:10px}}

 /* Footer */
 footer{padding:40px 0 56px;border-top:1px solid var(--line);color:var(--sub);font-size:14px}
 footer .wrap{display:flex;gap:16px 28px;flex-wrap:wrap;align-items:center}
 footer .links{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
 footer .links a{color:var(--sub)}
</style>
</head>
<body>

<header class="top">
 <div class="wrap">
  <a class="logo" href="#"><i aria-hidden="true"></i>liquid-tabbar <span style="font-weight:400;opacity:.6">on web</span></a>
  <nav aria-label="Sections">
   <a href="#demos" data-t="navDemo"></a>
   <a href="#playground" data-t="navPlay"></a>
   <a href="#features" data-t="navFeat"></a>
   <a href="#start" data-t="navStart"></a>
   <a href="https://github.com/mailoswang/liquid-tabbar-on-web">GitHub</a>
  </nav>
  <div class="tools">
   <span id="lang" class="seg" role="group" aria-label="Language"></span>
   <button class="chip icon-btn" id="themeBtn" type="button"></button>
  </div>
 </div>
</header>

<main>
 <!-- Hero -->
 <section class="hero wall-a">
  <div class="wrap">
   <div>
    <span class="eyebrow"><span id="eyebrow"></span></span>
    <h1 data-h="h1"></h1>
    <p class="lede" data-t="lede"></p>
    <div class="ctas">
     <a class="btn btn-primary" href="#start" data-t="ctaStart"></a>
     <a class="btn btn-glass" href="#playground" data-t="ctaPlay"></a>
    </div>
   </div>
   <div class="hero-side">
    <div class="phone"><div class="scr wall-a"><div class="scroller" id="heroScr"></div><nav id="heroBar" aria-label="Demo tab bar"></nav></div></div>
    <span class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 10a2 2 0 0 1 4 0v2a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 4 13.2V12a2 2 0 0 1 4 0"/></svg><span data-t="heroHint"></span></span>
   </div>
  </div>
 </section>

 <!-- Showcase -->
 <section class="sec" id="demos">
  <div class="wrap">
   <p class="kicker" data-t="showK"></p>
   <h2 data-t="showH"></h2>
   <p class="sub" data-t="showSub"></p>
   <div class="cards">
    <article class="card">
     <div class="stage wall-a"><span class="badge" data-t="badgeDrag"></span><div class="scroller" id="s1"></div><nav id="b1" aria-label="Demo tab bar"></nav></div>
     <div class="meta"><h3><span data-t="c1h"></span><code>onSelect</code></h3><p data-t="c1p"></p><a class="more" data-doc="quick" data-t="docs"></a></div>
    </article>
    <article class="card">
     <div class="stage wall-c"><span class="badge" data-t="badgeSide"></span><div class="scroller" id="s2"></div><nav id="b2" aria-label="Demo tab bar"></nav></div>
     <div class="meta"><h3><span data-t="c2h"></span><code>side</code></h3><p data-t="c2p"></p><a class="more" data-doc="side" data-t="docs"></a></div>
    </article>
    <article class="card">
     <div class="stage wall-d"><span class="badge" data-t="badgeScroll"></span><div class="scroller" id="s3"></div><nav id="b3" aria-label="Demo tab bar"></nav></div>
     <div class="meta"><h3><span data-t="c3h"></span><code>minimizeOnScroll</code></h3><p data-t="c3p"></p><a class="more" data-doc="options" data-t="docs"></a></div>
    </article>
    <article class="card">
     <div class="stage wall-b"><div class="swatches" id="sw" role="group" aria-label="Accent"></div><div class="scroller" id="s4"></div><nav id="b4" class="ltb--light" aria-label="Demo tab bar"></nav></div>
     <div class="meta"><h3><span data-t="c4h"></span><code>--ltb-accent</code></h3><p data-t="c4p"></p><a class="more" data-doc="vars" data-t="docs"></a></div>
    </article>
   </div>
  </div>
 </section>

 <!-- Playground -->
 <section class="sec alt" id="playground">
  <div class="wrap">
   <p class="kicker" data-t="playK"></p>
   <h2 data-t="playH"></h2>
   <p class="sub" data-t="playSub"></p>
   <div class="play">
    <div class="phone"><div class="scr wall-a" id="playScr"><div class="scroller" id="s5"></div><nav id="bar" aria-label="Demo tab bar"></nav></div></div>
    <div>
     <div class="panel">
      <div class="row"><b id="l-count" data-t="count"></b><span id="count" class="seg" role="group" aria-labelledby="l-count"></span></div>
      <div class="row"><b id="l-theme" data-t="theme"></b><span id="theme" class="seg" role="group" aria-labelledby="l-theme"></span></div>
      <div class="row"><b id="l-labels" data-t="labels"></b><span id="labels" class="seg" role="group" aria-labelledby="l-labels"></span></div>
      <div class="row"><b id="l-side" data-t="side"></b><span id="side" class="seg" role="group" aria-labelledby="l-side"></span></div>
      <div class="row"><b id="l-min" data-t="min"></b><span id="min" class="seg" role="group" aria-labelledby="l-min"></span></div>
      <div class="row"><b><label for="accent" data-t="accent"></label></b><span class="colors"><input type="color" id="accent" value="#ff3d47"><code id="accentHex">#ff3d47</code></span></div>
     </div>
     <div id="log" aria-live="polite"></div>
     <div class="codebox"><button class="chip copy" type="button" data-copy="playCode" data-t="copy"></button><pre><code id="playCode"></code></pre></div>
    </div>
   </div>
  </div>
 </section>

 <!-- Features -->
 <section class="sec" id="features">
  <div class="wrap">
   <p class="kicker" data-t="featK"></p>
   <h2 data-t="featH"></h2>
   <p class="sub" data-t="featSub"></p>
   <div class="feats" id="feats"></div>
  </div>
 </section>

 <!-- Support -->
 <section class="sec alt" id="support">
  <div class="wrap">
   <p class="kicker" data-t="supK"></p>
   <h2 data-t="supH"></h2>
   <p class="sub" data-t="supSub"></p>
   <div class="support">
    <div class="eng"><b>Safari · iOS</b><span class="v">16.4+</span></div>
    <div class="eng"><b>Chrome · Edge</b><span class="v">120+</span></div>
    <div class="eng"><b>Firefox</b><span class="v">128+</span></div>
   </div>
   <div class="tablewrap"><table>
    <thead><tr><th data-t="thNative"></th><th data-t="thWeb"></th></tr></thead>

  onReselect: (item, i, info) => { log(T().reselect(item.id, i, info.source)); s5.scrollTo({ top: 0, behavior: "smooth" }); },
  onSide: side => log(T().sideLog(side.id)),
  minimizeOnScroll: state.min, scrollTarget: s5
 });
 bar.el.style.setProperty("--ltb-accent", state.accent);
 const render = () => {
  const t = T();
  let items = itemsFor(state.n, state.labels);
  if (state.side === "back") items = items.filter((a, i) => i !== 1);          // Detail page: drop the second tab
  if (state.side === "search") items = items.filter(a => a.id !== "search");    // Search moves to the button, no duplicate tab
  if (!items.some(a => a.id === state.active)) state.active = items[0].id;
  const side = state.side ? { id: state.side, label: t[state.side], icon: ICONS[state.side] } : null;
  bar.set({ side, items, active: state.active });
  document.getElementById("playScr").className = "scr " + (state.theme === "light" ? "wall-b" : "wall-a");
  paintScreen(s5, state.active, { tiles: 8, light: state.theme === "light" });
  writeCode();
 };

 // Code that reproduces the playground
 const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
 function writeCode() {
  const t = T();
  let items = itemsFor(state.n, state.labels);
  if (state.side === "back") items = items.filter((a, i) => i !== 1);
  if (state.side === "search") items = items.filter(a => a.id !== "search");
  const icon = id => `ICONS.${id === "likes" ? "heart" : id === "inbox" ? "bell" : id === "me" ? "user" : id}`;
  const lines = [];
  lines.push(`<nav id="tabs"${state.theme === "light" ? ' class="ltb--light"' : ""} aria-label="${lang === "zh" ? "主要導覽" : "Main"}"></nav>`);
  lines.push(`<style>#tabs { --ltb-accent: ${state.accent} }</style>`, "", "<script>");
  lines.push(`  const tabs = new LiquidTabbar("#tabs", {`, `    items: [`);
  items.forEach((a, i) => lines.push(`      { id: "${a.id}", ${state.labels ? `label: "${a.label}", ` : ""}icon: ${icon(a.id)} }${i < items.length - 1 ? "," : ""}`));
  lines.push(`    ],`);
  if (state.side) lines.push(`    side: { id: "${state.side}", label: "${t[state.side]}", icon: ICONS.${state.side} },`);
  if (state.min) lines.push(`    minimizeOnScroll: true,`);
  lines.push(`    onSelect: item => show(item.id)`, `  });`, "<\/script>");
  document.getElementById("playCode").innerHTML = esc(lines.join("\n"));
 }

 // Controls: option buttons whose text comes from TEXT, so they can be relabeled on a language switch
 const groups = [];
 const opts = (host, list, get, set) => {
  const el = document.getElementById(host), btns = [];
  const paint = () => btns.forEach((b, i) => { const on = list[i][1] === get(); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  list.forEach(([key, v]) => {
   const b = document.createElement("button");
   b.className = "opt"; b.type = "button";
   b.onclick = () => { set(v); paint(); if (host !== "lang") render(); };
   el.appendChild(b); btns.push(b);
  });
  groups.push({ list, btns });
  paint();
 };
 opts("count", [["3", 3], ["4", 4], ["5", 5]], () => state.n, v => state.n = v);
 opts("theme", [["dark", "dark"], ["light", "light"]], () => state.theme, v => { state.theme = v; bar.el.classList.toggle("ltb--light", v === "light"); });
 opts("labels", [["show", true], ["iconsOnly", false]], () => state.labels, v => state.labels = v);
 opts("side", [["none", null], ["back", "back"], ["search", "search"], ["edit", "edit"]], () => state.side, v => state.side = v);
 opts("min", [["on", true], ["off", false]], () => state.min, v => { state.min = v; bar.setMinimizeOnScroll(v, s5); });
 opts("lang", [["EN", "en"], ["中文", "zh"]], () => lang, v => { lang = v; store.set("ltb-demo-lang", v); applyText(); });
 document.getElementById("accent").oninput = e => {
  state.accent = e.target.value;
  bar.el.style.setProperty("--ltb-accent", state.accent);
  document.getElementById("accentHex").textContent = state.accent;
  writeCode();
 };

 // Page theme: follows the system until the header button is used
 const themeBtn = document.getElementById("themeBtn");
 const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
 const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
 const mq = matchMedia("(prefers-color-scheme: dark)");
 const isDark = () => (document.documentElement.dataset.theme || (mq.matches ? "dark" : "light")) === "dark";
 const paintThemeBtn = () => { themeBtn.innerHTML = isDark() ? SUN : MOON; themeBtn.setAttribute("aria-label", isDark() ? T().theme_to_light : T().theme_to_dark); };
 { const s = store.get("ltb-demo-theme"); if (s === "dark" || s === "light") document.documentElement.dataset.theme = s; }
 themeBtn.onclick = () => { const v = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = v; store.set("ltb-demo-theme", v); paintThemeBtn(); };
 mq.addEventListener?.("change", paintThemeBtn);

 // Copy buttons
 document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
  try { await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent); b.textContent = T().copied; setTimeout(() => b.textContent = T().copy, 1400); } catch (_) {}
 });

 // Static code samples (version comes from the loaded library)
 const CDN = `https://cdn.jsdelivr.net/gh/mailoswang/liquid-tabbar-on-web@v${VER}`;
 function writeSteps() {
  const t = T(), zh = lang === "zh";
  document.getElementById("code1").textContent = `<link rel="stylesheet" href="${CDN}/liquid-tabbar.min.css">\n<script src="${CDN}/liquid-tabbar.min.js"><\/script>`;
  document.getElementById("code2").textContent = `<main style="padding-bottom: calc(110px + env(safe-area-inset-bottom))">…</main>\n<nav id="tabs" aria-label="${zh ? "主要導覽" : "Main"}"></nav>`;
  document.getElementById("code3").textContent =
`const tabs = new LiquidTabbar("#tabs", {
  items: [
    { id: "home",   label: "${t.items.home}", icon: ICONS.home },
    { id: "search", label: "${t.items.search}", icon: ICONS.search },
    { id: "me",     label: "${t.items.me}", icon: ICONS.user }
  ],
  active: "home",
  onSelect: item => show(item.id),
  onReselect: () => window.scrollTo({ top: 0, behavior: "smooth" })
});`;
 }

 // Put the current language's text on the page
 const FEAT_IC = [
  ["#ff6a4d", '<rect x="3" y="8" width="18" height="8" rx="4"/>'],
  ["#7b5cff", '<circle cx="12" cy="12" r="7"/><path d="M5 12h14"/>'],
  ["#00b894", '<path d="M5 12l5 5L20 7"/>'],
  ["#0a84ff", '<path d="m14 6-6 6 6 6"/>'],
  ["#ff9f0a", '<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>'],
  ["#af52de", '<circle cx="12" cy="5" r="2"/><path d="M5 9h14M12 9v12M8 21l4-7 4 7"/>']
 ];
 function applyText() {
  const t = T();
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.title = t.title;
  document.getElementById("lang").setAttribute("aria-label", t.lang);
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-h]").forEach(el => { el.innerHTML = t[el.dataset.h]; });
  document.querySelectorAll("[data-doc]").forEach(el => { el.href = docUrl(lang, el.dataset.doc); });
  document.getElementById("eyebrow").textContent = `${t.eyebrow} · v${VER}`;
  groups.forEach(({ list, btns }) => btns.forEach((b, i) => { b.textContent = t[list[i][0]] || list[i][0]; }));
  if (!logged) document.getElementById("log").textContent = t.hint;
  document.getElementById("feats").innerHTML = t.feats.map(([h, p], i) =>
   `<div class="feat"><div class="ic" style="background:${FEAT_IC[i][0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${FEAT_IC[i][1]}</svg></div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
  document.getElementById("limits").innerHTML = t.limits.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("");
  paintThemeBtn();
  writeSteps();
  renderHero(); renderC1(); renderC2(); renderC3(); renderC4(); render();
 }
 fit();
 applyText();
