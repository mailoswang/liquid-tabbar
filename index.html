<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>liquid-tabbar · Native Liquid Glass, on the web</title>
<link rel="stylesheet" href="liquid-tabbar.css?v=2.6.2">
<style>
 :root{--bg:#101012;--ink:#f4f4f5;--sub:#a1a1aa;--card:#1c1c20;--line:rgba(255,255,255,.1)}
 :root[data-theme="light"]{--bg:#f3f3f3;--ink:#141414;--sub:#6d6d6d;--card:#fff;--line:rgba(0,0,0,.1)}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding:24px 16px 140px}
 main{max-width:640px;margin:0 auto}
 header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 4px}
 h1{font-size:1.6rem;margin:0}
 p{color:var(--sub);margin:0 0 20px}
 .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px;display:grid;gap:14px}
 .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 .row b{min-width:96px;font-weight:600}
 button.opt{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
 button.opt.on{background:var(--ink);color:var(--bg)}
 #lang button.opt{padding:2px 12px;font-size:13px}
 input[type=color]{width:40px;height:28px;border:0;background:none;padding:0}
 #log{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--sub);min-height:3em;white-space:pre-wrap}
 /* Background tiles, to see the glass against color */
 .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 .tiles div{aspect-ratio:2/3;border-radius:12px}
</style>
</head>
<body>
<main>
 <header><h1>liquid-tabbar</h1><span id="lang" role="group" aria-label="Language"></span></header>
 <p data-t="intro"></p>

 <div class="panel">
  <div class="row"><b id="l-count" data-t="count"></b><span id="count" role="group" aria-labelledby="l-count"></span></div>
  <div class="row"><b id="l-theme" data-t="theme"></b><span id="theme" role="group" aria-labelledby="l-theme"></span></div>
  <div class="row"><b id="l-labels" data-t="labels"></b><span id="labels" role="group" aria-labelledby="l-labels"></span></div>
  <div class="row"><b id="l-side" data-t="side"></b><span id="side" role="group" aria-labelledby="l-side"></span></div>
  <div class="row"><b data-t="accent"></b><input type="color" id="accent" value="#ff3d47"></div>
  <div id="log"></div>
 </div>

 <div class="tiles" id="tiles"></div>
</main>

<nav id="bar"></nav>

<script src="liquid-tabbar.js?v=2.6.2"></script><!-- ?v= 跟著函式庫版本改，瀏覽器才不會拿快取的舊版配新頁面 -->
<script>
 // All text on the page, per language. English is the default
 const TEXT = {
  en: {
   title: "liquid-tabbar · Native Liquid Glass, on the web",
   intro: "The iOS Liquid Glass tab bar, recreated on the web. Tap to switch, or press and drag sideways: icons under the pill change color, and the tab switches when you let go. \"Side button\" adds a separate round button to the left of the bar (for example, back on a detail page).",
   lang: "Language", count: "Tabs", theme: "Theme", labels: "Labels", side: "Side button", accent: "Accent",
   dark: "Dark", light: "Light", show: "Show", iconsOnly: "Icons only",
   none: "None", back: "Back", search: "Search", edit: "Edit",
   items: { home: "Home", search: "Search", likes: "Likes", inbox: "Inbox", me: "Me" },
   hint: "(Tap or drag on the tab bar below)",
   select: (id, i, src) => `onSelect   ${id} (tab ${i}, ${src})`,
   reselect: (id, i, src) => `onReselect ${id} (tab ${i}, ${src})`,
   sideLog: id => `onSide     ${id} (side button)`
  },
  zh: {
   title: "liquid-tabbar · 網頁上的原生液態玻璃",
   intro: "在網頁上模擬 iOS 原生液態玻璃（Liquid Glass）分頁列。按一下切換，按住可以左右拖動，膠囊蓋到的圖示會變色，鬆手才切換。「左邊按鈕」可以在分頁列左邊加一顆單獨的圓形按鈕（例如進入內頁時的返回）。",
   lang: "語言", count: "數量", theme: "外觀", labels: "文字", side: "左邊按鈕", accent: "強調色",
   dark: "深色", light: "淺色", show: "顯示", iconsOnly: "只有圖示",
   none: "無", back: "返回", search: "搜尋", edit: "編輯",
   items: { home: "首頁", search: "搜尋", likes: "收藏", inbox: "通知", me: "我的" },
   hint: "（在下方分頁列上點按或拖動）",
   select: (id, i, src) => `onSelect   ${id}（第 ${i} 格，${src}）`,
   reselect: (id, i, src) => `onReselect ${id}（第 ${i} 格，${src}）`,
   sideLog: id => `onSide     ${id}（左邊的圓形按鈕）`
  }
 };
 // Language: ?lang=en / ?lang=zh in the URL, else the last choice, else English
 const pickLang = () => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "zh") return q;
  try { const s = localStorage.getItem("ltb-demo-lang"); if (s === "en" || s === "zh") return s; } catch (_) {}
  return "en";
 };
 let lang = pickLang();
 const T = () => TEXT[lang];

 // Icons: paths inside a 24×24 viewBox (a full <svg> works too)
 const ICONS = {
  home: '<path d="M10.7 3.4a2 2 0 0 1 2.6 0l7.1 6.1c.4.4.6.9.6 1.4V19a2 2 0 0 1-2 2h-3.6a.9.9 0 0 1-.9-.9v-4.4a1.6 1.6 0 0 0-1.6-1.6h-1.8a1.6 1.6 0 0 0-1.6 1.6v4.4a.9.9 0 0 1-.9.9H5a2 2 0 0 1-2-2v-8.1c0-.5.2-1 .6-1.4z"/>',
  search: '<circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15 15 5.5 5.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
  heart: '<path d="M12 20.5s-8-4.6-8-10.4A4.6 4.6 0 0 1 12 7.3a4.6 4.6 0 0 1 8 2.8c0 5.8-8 10.4-8 10.4z"/>',
  bell: '<path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 16a1 1 0 0 0 .9 1.5h13.6a1 1 0 0 0 .9-1.5L18 12.6V9a6 6 0 0 0-6-6z"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0z"/>',
  user: '<circle cx="12" cy="8" r="4.2"/><path d="M3.8 20.2c.8-4 4.2-6.4 8.2-6.4s7.4 2.4 8.2 6.4a.9.9 0 0 1-.9 1H4.7a.9.9 0 0 1-.9-1z"/>',
  back: '<path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
  edit: '<path d="M15.4 4.1a2.5 2.5 0 0 1 3.5 0l1 1a2.5 2.5 0 0 1 0 3.5L9.6 18.9l-5.1 1.5a.7.7 0 0 1-.9-.9l1.5-5.1z"/><rect x="12.5" y="18.9" width="8.5" height="2.2" rx="1.1"/>'
 };
 const ALL = [
  { id: "home", icon: ICONS.home },
  { id: "search", icon: ICONS.search },
  { id: "likes", icon: ICONS.heart },
  { id: "inbox", icon: ICONS.bell },
  { id: "me", icon: ICONS.user }
 ];
 const state = { n: 4, labels: true, active: "home", side: null };
 let logged = false;
 const log = t => { logged = true; document.getElementById("log").textContent = t; };

 const bar = new LiquidTabbar("#bar", {
  onSelect: (item, i, info) => { state.active = item.id; log(T().select(item.id, i, info.source)); },
  onReselect: (item, i, info) => log(T().reselect(item.id, i, info.source)),
  onSide: side => log(T().sideLog(side.id))
 });
 const render = () => {
  const t = T();
  let items = ALL.slice(0, state.n).map(a => ({ ...a, label: state.labels ? t.items[a.id] : "" }));
  if (state.side === "back") items = items.filter((a, i) => i !== 1);          // Detail page: drop the second tab
  if (state.side === "search") items = items.filter(a => a.id !== "search");    // Search moves to the button, no duplicate tab
  if (!items.some(a => a.id === state.active)) state.active = items[0].id;
  const side = state.side ? { id: state.side, label: t[state.side], icon: ICONS[state.side] } : null;
  bar.set({ side, items, active: state.active });
 };

 // Controls: option buttons whose text comes from TEXT, so they can be relabeled on a language switch
 const groups = [];
 const opts = (host, list, get, set) => {
  const el = document.getElementById(host), btns = [];
  const paint = () => btns.forEach((b, i) => { const on = list[i][1] === get(); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  list.forEach(([key, v]) => {
   const b = document.createElement("button");
   b.className = "opt"; b.type = "button";
   b.onclick = () => { set(v); paint(); render(); };
   el.appendChild(b); btns.push(b);
  });
  groups.push({ list, btns });
  paint();
 };
 opts("count", [["3", 3], ["4", 4], ["5", 5]], () => state.n, v => state.n = v);
 opts("labels", [["show", true], ["iconsOnly", false]], () => state.labels, v => state.labels = v);
 opts("side", [["none", null], ["back", "back"], ["search", "search"], ["edit", "edit"]], () => state.side, v => state.side = v);
 opts("theme", [["dark", "dark"], ["light", "light"]], () => document.documentElement.dataset.theme || "dark", v => {
  document.documentElement.dataset.theme = v;
  bar.el.classList.toggle("ltb--light", v === "light");
 });
 opts("lang", [["English", "en"], ["中文", "zh"]], () => lang, v => {
  lang = v;
  try { localStorage.setItem("ltb-demo-lang", v); } catch (_) {}
  applyText();
 });
 document.getElementById("accent").oninput = e => bar.el.style.setProperty("--ltb-accent", e.target.value);

 // Put the current language's text on the page
 function applyText() {
  const t = T();
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.title = t.title;
  document.getElementById("lang").setAttribute("aria-label", t.lang);
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  groups.forEach(({ list, btns }) => btns.forEach((b, i) => { b.textContent = t[list[i][0]] || list[i][0]; }));
  if (!logged) document.getElementById("log").textContent = t.hint;
 }

 // Background tiles
 const tiles = document.getElementById("tiles");
 for (let i = 0; i < 18; i++) {
  const d = document.createElement("div"), h = (i * 47) % 360;
  d.style.background = `linear-gradient(160deg,hsl(${h} 80% 60%),hsl(${(h + 40) % 360} 70% 35%))`;
  tiles.appendChild(d);
 }
 applyText();
 render();
</script>
</body>
</html>
